<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Zoomy Moto! — Toy Motorcycle Adventure</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" aria-label="Zoomy Moto Game Canvas"></canvas>

    <!-- Top HUD (Playing State) -->
    <div id="hud" class="overlay hidden">
      <div class="hud-left">
        <button id="btn-hud-levels" class="icon-btn small-btn" title="Levels" aria-label="Level Select">
          <svg viewBox="0 0 36 36" width="28" height="28" aria-hidden="true">
            <rect x="4" y="5" width="11" height="11" rx="3" fill="currentColor"/>
            <rect x="21" y="5" width="11" height="11" rx="3" fill="currentColor"/>
            <rect x="4" y="20" width="11" height="11" rx="3" fill="currentColor"/>
            <rect x="21" y="20" width="11" height="11" rx="3" fill="currentColor"/>
          </svg>
        </button>
        <div id="hud-level-badge" class="level-pill">
          <span class="pill-star">★</span>
          <span id="hud-level-num">1</span>
        </div>
      </div>

      <!-- Visual Non-Numerical Progress Track -->
      <div class="hud-center">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
          <div id="progress-bike" class="progress-bike" aria-hidden="true">🏍️</div>
          <div class="progress-flag" aria-hidden="true">🏁</div>
        </div>
      </div>

      <div class="hud-right">
        <button id="btn-hud-music" class="icon-btn small-btn" title="Toggle Music" aria-label="Toggle Music">
          <span id="icon-music">🎵</span>
        </button>
        <button id="btn-hud-sfx" class="icon-btn small-btn" title="Toggle Sound Effects" aria-label="Toggle Sound">
          <span id="icon-sfx">🔊</span>
        </button>
        <button id="btn-hud-retry" class="icon-btn small-btn retry-accent" title="Restart (R)" aria-label="Restart Level">
          <svg viewBox="0 0 36 36" width="28" height="28" aria-hidden="true">
            <path d="M18 6 A12 12 0 1 0 30 18" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
            <polygon points="18,1 26,7 18,13" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- First-Class Child Touch / Pointer Controls -->
    <div id="touch-controls" class="overlay hidden">
      <button id="pedal-brake" class="pedal-btn brake-pedal" aria-label="Brake / Slow Down">
        <div class="pedal-face">
          <svg viewBox="0 0 80 80" class="pedal-svg" aria-hidden="true">
            <!-- Big friendly left brake icon + slow turtle shell waves -->
            <polygon points="46,18 20,40 46,62" fill="#fff"/>
            <rect x="52" y="22" width="9" height="36" rx="4" fill="#fff"/>
          </svg>
          <span class="pedal-label">SLOW</span>
        </div>
      </button>

      <!-- Visual-only Speed Feel Meter (No numbers!) -->
      <div class="speed-arc-wrap" aria-hidden="true">
        <div class="speed-segments">
          <div id="spd-seg-1" class="spd-seg seg-slow"></div>
          <div id="spd-seg-2" class="spd-seg seg-slow"></div>
          <div id="spd-seg-3" class="spd-seg seg-med"></div>
          <div id="spd-seg-4" class="spd-seg seg-med"></div>
          <div id="spd-seg-5" class="spd-seg seg-fast"></div>
          <div id="spd-seg-6" class="spd-seg seg-fast"></div>
        </div>
      </div>

      <button id="pedal-accel" class="pedal-btn accel-pedal" aria-label="Accelerate / Go">
        <div class="pedal-face">
          <svg viewBox="0 0 80 80" class="pedal-svg" aria-hidden="true">
            <polygon points="20,16 50,40 20,64" fill="#fff"/>
            <polygon points="42,16 70,40 42,64" fill="#fff" opacity="0.85"/>
          </svg>
          <span class="pedal-label">GO!</span>
        </div>
      </button>
    </div>

    <!-- Title / Start Screen -->
    <div id="screen-title" class="modal-screen">
      <div class="title-card">
        <div class="title-badge">🏍️✨</div>
        <h1 class="game-logo">
          <span class="logo-zoomy">ZOOMY</span>
          <span class="logo-moto">MOTO!</span>
        </h1>
        <div class="title-actions">
          <button id="btn-play" class="big-btn green-btn pulse-btn" aria-label="Play Game">
            <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true">
              <polygon points="14,8 40,24 14,40" fill="#fff"/>
            </svg>
          </button>
          <div class="title-sub-actions">
            <button id="btn-open-levels" class="big-btn blue-btn" aria-label="Choose Level">
              <svg viewBox="0 0 36 36" width="30" height="30" aria-hidden="true">
                <rect x="4" y="5" width="11" height="11" rx="3" fill="#fff"/>
                <rect x="21" y="5" width="11" height="11" rx="3" fill="#fff"/>
                <rect x="4" y="20" width="11" height="11" rx="3" fill="#fff"/>
                <rect x="21" y="20" width="11" height="11" rx="3" fill="#fff"/>
              </svg>
            </button>
            <button id="btn-title-audio" class="big-btn amber-btn" aria-label="Toggle Sound">
              <span id="icon-title-audio" style="font-size: 28px;">🔊</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Level Select Screen -->
    <div id="screen-levels" class="modal-screen hidden">
      <div class="panel-card">
        <div class="panel-header">
          <button id="btn-levels-back" class="icon-btn" aria-label="Back">
            <svg viewBox="0 0 36 36" width="28" height="28" aria-hidden="true">
              <polygon points="24,7 10,18 24,29" fill="currentColor"/>
            </svg>
          </button>
          <div class="panel-title-icons" aria-label="Levels">🏁 ★ 🏍️</div>
          <div style="width: 54px;"></div>
        </div>
        <div id="level-grid" class="level-grid"></div>
      </div>
    </div>

    <!-- Finish / Celebration Screen -->
    <div id="screen-finish" class="modal-screen hidden">
      <div class="finish-card">
        <div class="finish-trophy" aria-hidden="true">🏆</div>
        <div id="finish-stars" class="finish-stars" aria-label="Earned Stars">
          <span class="star-slot">★</span>
          <span class="star-slot">★</span>
          <span class="star-slot">★</span>
        </div>
        <div class="finish-buttons">
          <button id="btn-finish-levels" class="big-btn blue-btn" aria-label="Levels">
            <svg viewBox="0 0 36 36" width="32" height="32" aria-hidden="true">
              <rect x="4" y="5" width="11" height="11" rx="3" fill="#fff"/>
              <rect x="21" y="5" width="11" height="11" rx="3" fill="#fff"/>
              <rect x="4" y="20" width="11" height="11" rx="3" fill="#fff"/>
              <rect x="21" y="20" width="11" height="11" rx="3" fill="#fff"/>
            </svg>
          </button>
          <button id="btn-finish-retry" class="big-btn amber-btn" aria-label="Retry Level">
            <svg viewBox="0 0 36 36" width="32" height="32" aria-hidden="true">
              <path d="M18 6 A12 12 0 1 0 30 18" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
              <polygon points="18,1 26,7 18,13" fill="#fff"/>
            </svg>
          </button>
          <button id="btn-finish-next" class="big-btn green-btn pulse-btn" aria-label="Next Level">
            <svg viewBox="0 0 48 48" width="42" height="42" aria-hidden="true">
              <polygon points="10,10 30,24 10,38" fill="#fff"/>
              <polygon points="24,10 44,24 24,38" fill="#fff"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Developer Level Editor Toolbar (Hidden in production unless F2 or ?debug=1) -->
    <div id="editor-bar" class="editor-bar hidden">
      <span class="editor-title">🛠️ DEV EDITOR (F2)</span>
      <button id="ed-add-road" class="ed-btn">+ Platform</button>
      <button id="ed-add-ramp" class="ed-btn">+ Ramp</button>
      <button id="ed-add-water" class="ed-btn">+ Pond</button>
      <button id="ed-add-foam" class="ed-btn">+ Foam Pit</button>
      <button id="ed-add-boxes" class="ed-btn">+ Boxes</button>
      <button id="ed-add-hint-fast" class="ed-btn">+ Fast Sign</button>
      <button id="ed-add-hint-slow" class="ed-btn">+ Slow Sign</button>
      <button id="ed-delete" class="ed-btn ed-danger">Delete Selected</button>
      <button id="ed-test" class="ed-btn ed-good">▶ Playtest</button>
      <button id="ed-export" class="ed-btn">Export JSON</button>
      <button id="ed-import" class="ed-btn">Import JSON</button>
    </div>
  </div>

  <!-- Ordered Classic Scripts for 100% Cross-Browser & file:// Compatibility -->
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/debug_editor.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
